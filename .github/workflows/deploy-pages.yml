name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - "web/notes.json"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: live-pages
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter build web --release --base-href /greetingcard/ --dart-define=NOTE_DISPATCH_TOKEN=${{ secrets.NOTE_DISPATCH_TOKEN }}
      - name: Keep the live notes file
        run: |
          mkdir -p build/web
          if [ -f live-pages/notes.json ]; then
            cp live-pages/notes.json build/web/notes.json
          elif [ -f web/notes.json ]; then
            cp web/notes.json build/web/notes.json
          fi
          python3 - <<'PY'
          from pathlib import Path
          stamp = Path('.git/HEAD').read_text().strip()[-7:]
          bootstrap = Path('build/web/flutter_bootstrap.js')
          text = bootstrap.read_text()
          text = text.replace('"main.dart.js"', f'"main.dart.js?v={stamp}"')
          bootstrap.write_text(text)
          index = Path('build/web/index.html')
          html = index.read_text()
          html = html.replace('flutter_bootstrap.js?v=notes1"', f'flutter_bootstrap.js?v={stamp}"')
          html = html.replace('flutter_bootstrap.js"', f'flutter_bootstrap.js?v={stamp}"')
          index.write_text(html)
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web
      - id: deployment
        uses: actions/deploy-pages@v4
